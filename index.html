<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수달 or 족제비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
  :root {
    --green: #3df70f; --magenta: #d61fc8; --red: #ff1744; --navy: #0f172a;
    --line: #2a2f3a; --muted: #8b93a3;
    --px: "Press Start 2P", "Galmuri11", monospace;
    --kr: "Galmuri11", "Malgun Gothic", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #e7ecf3; font-family: var(--kr); min-height: 100vh; }

  /* 상단 바 */
  .top { border-bottom: 1px solid var(--line); }
  .top-in { max-width: 1100px; margin: 0 auto; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { font-family: var(--px); font-size: clamp(.8rem, 2.6vw, 1.35rem); display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .logo .g { color: var(--green); text-shadow: 0 0 8px rgba(61,247,15,.5); }
  .logo .m { color: var(--magenta); text-shadow: 0 0 8px rgba(214,31,200,.5); }
  .best { border: 1px solid var(--magenta); color: #ff7ae8; padding: 10px 14px; font-size: .9rem; white-space: nowrap; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px 40px; }

  /* HUD */
  .hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 26px 8px 18px; }
  .hearts { display: flex; gap: 14px; }
  .hearts svg { width: clamp(28px, 6vw, 46px); height: auto; fill: var(--red); filter: drop-shadow(0 0 8px rgba(255,23,68,.8)); transition: transform .2s; }
  .hearts svg.lost { fill: #2a1218; stroke: #5b2230; stroke-width: 1.2; filter: none; }
  .hearts.hit svg:not(.lost) { animation: shake .35s; }
  .round { text-align: center; line-height: 1.3; }
  .round b { display: block; font-family: var(--px); font-size: clamp(1.2rem, 4vw, 2rem); color: var(--green); text-shadow: 0 0 10px rgba(61,247,15,.6); }
  .round span { color: var(--green); font-size: .85rem; }
  .score { justify-self: end; display: flex; align-items: center; gap: 16px; }
  .score small { color: var(--muted); font-size: 1rem; }
  .score b { font-family: var(--px); font-size: clamp(1.1rem, 4vw, 2rem); color: var(--green); text-shadow: 0 0 10px rgba(61,247,15,.6); }
  @keyframes shake { 25% { transform: translateX(-4px) } 75% { transform: translateX(4px) } }

  /* 사진 프레임 */
  .frame {
    position: relative; overflow: hidden; background: var(--navy);
    border: 3px solid #323a4d; height: clamp(300px, 58vh, 640px);
    touch-action: none; cursor: grab; transition: border-color .2s, box-shadow .2s;
  }
  .frame:active { cursor: grabbing; }
  .frame.ok { border-color: var(--green); box-shadow: 0 0 18px rgba(61,247,15,.5); }
  .frame.bad { border-color: var(--red); box-shadow: 0 0 18px rgba(255,23,68,.5); }
  .frame img { width: 100%; height: 100%; object-fit: contain; display: block; user-select: none; -webkit-user-drag: none; transform-origin: center; }
  .hint { text-align: center; color: var(--muted); font-size: .85rem; margin: 12px 0 0; }

  /* 오버레이 (시작/게임오버) */
  .overlay {
    position: absolute; inset: 0; background: rgba(5,8,20,.94); display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 20px; cursor: default; z-index: 2;
  }
  .overlay h2 { font-family: var(--px); font-size: clamp(1.1rem, 4vw, 2rem); margin: 0; color: var(--green); text-shadow: 0 0 12px rgba(61,247,15,.6); line-height: 1.5; }
  .overlay h2.m { color: var(--magenta); text-shadow: 0 0 12px rgba(214,31,200,.6); }
  .overlay p { margin: 0; line-height: 1.8; color: #cfd6e4; }
  .overlay .st { color: var(--muted); font-size: .9rem; }
  .overlay .warn { border: 1px solid #b38a00; color: #ffd75e; padding: 10px 14px; font-size: .9rem; max-width: 460px; }
  .hidden { display: none !important; }

  /* 질문 + 버튼 */
  .ask { text-align: center; margin: 26px 0 22px; color: #cfd6e4; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(20px, 6vw, 56px); padding: 0 8px 8px 0; }
  .btn {
    font-family: var(--px); font-size: clamp(1rem, 4vw, 2.2rem); background: #000; cursor: pointer;
    padding: clamp(20px, 4vw, 36px) 8px; border: 4px solid var(--c); color: var(--c);
    box-shadow: 8px 8px 0 var(--c); transition: transform .08s, box-shadow .08s, background .15s;
  }
  .btn:hover { background: color-mix(in srgb, var(--c) 14%, #000); }
  .btn:active { transform: translate(6px, 6px); box-shadow: 2px 2px 0 var(--c); }
  .btn.otter { --c: var(--green); text-shadow: 0 0 10px rgba(61,247,15,.5); }
  .btn.weasel { --c: var(--magenta); text-shadow: 0 0 10px rgba(214,31,200,.5); }
  .btn.small { font-size: clamp(.8rem, 2.6vw, 1.1rem); padding: 14px 26px; border-width: 3px; box-shadow: 5px 5px 0 var(--c); }

  /* 결과 */
  .result { text-align: center; margin: 22px 0 8px; }
  .verdict { font-size: clamp(1.1rem, 3vw, 1.5rem); margin: 0 0 12px; }
  .verdict.ok { color: var(--green); } .verdict.bad { color: var(--red); }
  .ai { max-width: 460px; margin: 0 auto 20px; font-size: .95rem; color: #cfd6e4; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  .bar-row .n { width: 56px; text-align: left; }
  .bar { flex: 1; height: 14px; background: #161b28; border: 1px solid #2d3447; }
  .bar i { display: block; height: 100%; width: 0; transition: width .5s; }
  .bar i.otter { background: var(--green); } .bar i.weasel { background: var(--magenta); }
  .bar-row .p { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }

  @media (max-width: 560px) {
    .top-in { padding: 12px; } .wrap { padding: 0 12px 30px; }
    .logo span.ic { display: none; }
    .score small { display: none; }
  }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo"><span class="ic">🦦</span><span><b class="g">수달</b><b class="m">or족제비</b></span></div>
  <div class="best">최고 점수 <span id="bestTxt">00000</span></div>
</div></header>

<div class="wrap">
  <div class="hud">
    <div class="hearts" id="hearts"></div>
    <div class="round"><b id="roundNum">-</b><span id="roundLabel">&nbsp;</span></div>
    <div class="score"><small>점수:</small><b id="scoreTxt">00000</b></div>
  </div>

  <div class="frame" id="frame">
    <img id="photo" alt="수달 또는 족제비 사진" draggable="false">

    <div class="overlay" id="startBox">
      <h2>수달일까<br>족제비일까?</h2>
      <p>사진을 보고 맞혀 보세요.<br>틀리면 하트가 하나씩 줄어들어요. 하트 3개를 모두 잃으면 끝!</p>
      <div class="warn hidden" id="noPhotos">게임에 쓸 사진이 없어요. <code>images</code> 폴더에 사진을 넣고 <code>photos.js</code>에 적어 주세요.</div>
      <p class="st" id="loadStatus">AI 불러오는 중…</p>
      <button class="btn otter small" id="startBtn" disabled>START</button>
    </div>

    <div class="overlay hidden" id="overBox">
      <h2 class="m">GAME OVER</h2>
      <p>최종 점수 <b id="finalScore" style="color:var(--green)"></b><br><span id="recordTxt"></span></p>
      <button class="btn otter small" id="againBtn">다시 도전</button>
    </div>
  </div>
  <p class="hint">휠·핀치로 확대 · 드래그로 이동 · 더블클릭으로 원래대로</p>

  <section id="askBox" class="hidden">
    <p class="ask">이 사진은 수달일까요, 족제비일까요?</p>
    <div class="choices">
      <button class="btn otter" data-pick="otter">수달</button>
      <button class="btn weasel" data-pick="weasel">족제비</button>
    </div>
    <p class="hint" style="margin-top:18px">키보드: ← 수달 · → 족제비</p>
  </section>

  <section id="resultBox" class="result hidden">
    <p class="verdict" id="verdict"></p>
    <div class="ai" id="aiBox"></div>
    <button class="btn otter small" id="nextBtn">다음 ▶</button>
  </section>

  <p class="hint" style="margin-top:30px"><a href="CREDITS.md" style="color:inherit">사진 출처(Wikimedia Commons)</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
<script src="photos.js"></script>
<script>
  const MODEL_URL = "https://teachablemachine.withgoogle.com/models/GMDTP65pD/";
  const MAX_LIVES = 3, POINTS = 100;
  const NAME = { otter: "수달", weasel: "족제비" };
  const HEART = '<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>';

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(5, "0");
  const photo = $("photo"), frame = $("frame");

  let model = null, cls = { otter: 0, weasel: 1 };
  let queue = [], current = null, aiPromise = null;
  let phase = "idle";                 // idle | loading | guess | reveal | over
  let round = 0, score = 0, lives = MAX_LIVES, badLoads = 0;
  let best = 0;
  try { best = parseInt(localStorage.getItem("otterWeaselBest") || "0", 10) || 0; } catch (e) {}

  /* ---------- 유틸 ---------- */
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function stageLabel(r) { return r <= 3 ? "워밍업" : r <= 8 ? "도전" : r <= 15 ? "고수" : "전문가"; }

  /* ---------- AI ---------- */
  async function loadModel() {
    try {
      model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
      const labels = model.getClassLabels();
      const o = labels.findIndex((l) => /수달|otter/i.test(l));
      const w = labels.findIndex((l) => /족제비|weasel/i.test(l));
      if (o >= 0 && w >= 0) cls = { otter: o, weasel: w };
      else console.warn("클래스 이름에서 수달/족제비를 못 찾아 0번=수달, 1번=족제비로 가정합니다:", labels);
      $("loadStatus").textContent = "AI 준비 완료";
    } catch (e) {
      console.error(e);
      $("loadStatus").textContent = "AI를 불러오지 못했어요 (AI 없이 플레이 가능)";
    }
    $("noPhotos").classList.toggle("hidden", PHOTOS.length > 0);
    $("startBtn").disabled = PHOTOS.length === 0;
  }

  async function ask(img) {
    if (!model) return null;
    const p = await model.predict(img);
    const o = p[cls.otter].probability, w = p[cls.weasel].probability;
    return { otter: o, weasel: w, guess: o >= w ? "otter" : "weasel" };
  }

  /* ---------- 화면 갱신 ---------- */
  function renderHearts(hit) {
    const box = $("hearts");
    box.innerHTML = "";
    for (let i = 0; i < MAX_LIVES; i++) {
      const d = document.createElement("span");
      d.innerHTML = HEART;
      const svg = d.firstChild;
      if (i >= lives) svg.classList.add("lost");
      box.appendChild(svg);
    }
    if (hit) { box.classList.remove("hit"); void box.offsetWidth; box.classList.add("hit"); }
  }
  function renderHud() {
    $("roundNum").textContent = round || "-";
    $("roundLabel").textContent = round ? stageLabel(round) : " ";
    $("scoreTxt").textContent = pad(score);
    $("bestTxt").textContent = pad(best);
    renderHearts(false);
  }
  function setPanels(which) {                    // which: ask | result | none
    $("askBox").classList.toggle("hidden", which !== "ask");
    $("resultBox").classList.toggle("hidden", which !== "result");
  }

  /* ---------- 게임 흐름 ---------- */
  function startGame() {
    round = 0; score = 0; lives = MAX_LIVES; badLoads = 0; queue = []; current = null;
    $("startBox").classList.add("hidden");
    $("overBox").classList.add("hidden");
    renderHud();
    nextPhoto();
  }

  function nextPhoto() {
    if (!queue.length) {
      queue = shuffle(PHOTOS);
      if (current && queue.length > 1 && queue[queue.length - 1] === current) queue.reverse();  // 같은 사진 연속 방지
    }
    current = queue.pop();
    phase = "loading";
    round++;
    frame.classList.remove("ok", "bad");
    setPanels("none");
    resetView();
    renderHud();
    photo.onload = () => { badLoads = 0; aiPromise = ask(photo); phase = "guess"; setPanels("ask"); };
    photo.onerror = () => {
      console.warn("사진을 못 불러옴:", current.src);
      round--;
      if (++badLoads >= PHOTOS.length) { phase = "idle"; $("startBox").classList.remove("hidden"); $("loadStatus").textContent = "사진 파일을 하나도 불러오지 못했어요. 이름과 경로를 확인하세요."; return; }
      nextPhoto();
    };
    photo.src = current.src;
  }

  async function answer(choice) {
    if (phase !== "guess") return;
    phase = "reveal";
    const truth = current.answer;
    const right = choice === truth;
    const ai = await aiPromise.catch((e) => { console.error(e); return null; });

    if (right) score += POINTS; else lives--;
    if (score > best) { best = score; try { localStorage.setItem("otterWeaselBest", String(best)); } catch (e) {} }
    renderHud();
    if (!right) renderHearts(true);

    frame.classList.add(right ? "ok" : "bad");
    const v = $("verdict");
    v.className = "verdict " + (right ? "ok" : "bad");
    v.textContent = (right ? "정답! " : "오답! ") + `이 사진은 ${NAME[truth]}${truth === "otter" ? "이에요" : "예요"}.`;
    $("aiBox").innerHTML = ai
      ? `<div style="margin-bottom:6px">AI의 생각: <b>${NAME[ai.guess]}</b> ${ai.guess === truth ? "⭕" : "❌"}</div>` +
        ["otter", "weasel"].map((k) =>
          `<div class="bar-row"><span class="n">${NAME[k]}</span><span class="bar"><i class="${k}" style="width:${(ai[k] * 100).toFixed(0)}%"></i></span><span class="p">${(ai[k] * 100).toFixed(0)}%</span></div>`).join("")
      : "";
    $("nextBtn").textContent = lives <= 0 ? "결과 보기 ▶" : "다음 ▶";
    setPanels("result");
  }

  function next() {
    if (phase !== "reveal") return;
    if (lives <= 0) return gameOver();
    nextPhoto();
  }

  function gameOver() {
    phase = "over";
    setPanels("none");
    $("finalScore").textContent = pad(score);
    $("recordTxt").textContent = score > 0 && score >= best ? "🏆 NEW RECORD!" : `최고 점수 ${pad(best)}`;
    $("overBox").classList.remove("hidden");
  }

  /* ---------- 확대 / 이동 ---------- */
  const view = { s: 1, x: 0, y: 0 };
  const pointers = new Map();
  function applyView() {
    const r = frame.getBoundingClientRect();
    const mx = (r.width * (view.s - 1)) / 2, my = (r.height * (view.s - 1)) / 2;
    view.x = Math.max(-mx, Math.min(mx, view.x));
    view.y = Math.max(-my, Math.min(my, view.y));
    photo.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`;
  }
  function resetView() { view.s = 1; view.x = 0; view.y = 0; applyView(); }
  function zoomBy(f) { view.s = Math.max(1, Math.min(6, view.s * f)); applyView(); }

  frame.addEventListener("wheel", (e) => { e.preventDefault(); zoomBy(Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
  frame.addEventListener("dblclick", resetView);
  frame.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".overlay")) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    frame.setPointerCapture(e.pointerId);
  });
  frame.addEventListener("pointermove", (e) => {
    const prev = pointers.get(e.pointerId);
    if (!prev) return;
    if (pointers.size === 1) {
      view.x += e.clientX - prev.x; view.y += e.clientY - prev.y;
    } else if (pointers.size === 2) {
      const other = [...pointers.entries()].find(([id]) => id !== e.pointerId)[1];
      const d0 = Math.hypot(prev.x - other.x, prev.y - other.y);
      const d1 = Math.hypot(e.clientX - other.x, e.clientY - other.y);
      if (d0 > 0) view.s = Math.max(1, Math.min(6, view.s * (d1 / d0)));
    }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    applyView();
  });
  ["pointerup", "pointercancel"].forEach((t) => frame.addEventListener(t, (e) => pointers.delete(e.pointerId)));
  window.addEventListener("resize", applyView);

  /* ---------- 이벤트 ---------- */
  $("startBtn").onclick = startGame;
  $("againBtn").onclick = startGame;
  $("nextBtn").onclick = next;
  document.querySelectorAll("[data-pick]").forEach((b) => (b.onclick = () => answer(b.dataset.pick)));
  window.addEventListener("keydown", (e) => {
    if (e.target.tagName === "BUTTON" && (e.key === "Enter" || e.key === " ")) return;
    if (phase === "guess") {
      if (e.key === "ArrowLeft" || e.key === "1") answer("otter");
      else if (e.key === "ArrowRight" || e.key === "2") answer("weasel");
    } else if (phase === "reveal" && (e.key === "Enter" || e.key === " ")) {
      e.preventDefault(); next();
    }
  });

  renderHud();
  loadModel();
</script>
</body>
</html>
